spring:
  application:
    name: vault-api

  datasource:
    url: jdbc:postgresql://localhost:5432/vaultapi
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 900000    # 15 min
  refresh-token-expiry-ms: 604800000 # 7 days
