spring:
  application:
    name: vault-api

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${DB_USERNAME:postgres}
    # No default on purpose: an unset DB_PASSWORD fails the context load instead of
    # silently trying a guessed password. Same rule as jwt.secret below.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 900000    # 15 min
  refresh-token-expiry-ms: 604800000 # 7 days
